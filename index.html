<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f2937">
<title>NVN Forklift Database</title>
  <link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NVN Database">


<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 15px;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #1f2937;
}

input, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

textarea { resize: vertical; }

button {
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.save { background: #198754; }
.search { background: #0d6efd; }
.clear { background: #6c757d; }
.add-event { background: #1f2937; }
.event-save { background: #198754; }

.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
  box-shadow: 0 2px 6px #00000012;
}

.event {
  border-left: 3px solid #0d6efd;
  padding: 10px;
  margin: 12px 0;
  background: #f8f9fa;
}

.event-date {
  color: #555;
  font-size: 14px;
  margin-bottom: 5px;
}

.hidden { display: none; }

#status {
  text-align: center;
  margin: 10px 0;
  font-size: 14px;
  word-break: break-word;
}
input.search-found {
  background: #ffeb3b !important;
  background-color: #ffeb3b !important;
  opacity: 1 !important;
}
</style>
</head>

<body>
<div class="container">

<h2>NVN FORKLIFT DATABASE</h2>

<input id="customer" placeholder="Customer Name">
<input id="location" placeholder="Location">
<input id="vehicle_name" placeholder="Vehicle Name">
<input id="model" placeholder="Model">
<input id="serial" placeholder="Serial Number">

<button id="saveBtn" class="save" onclick="saveVehicle()" style="display:none;">SAVE</button>
<button class="search" onclick="searchVehicle()">SEARCH</button>
<button class="clear" onclick="clearForm()">CLEAR</button>

<div id="status"></div>

<div id="historySection" class="card hidden">

<h3>History</h3>

<button class="add-event" onclick="showEventForm()">
+ ADD EVENT
</button>

<div id="eventForm" class="hidden">

<input type="date" id="eventDate">
<input id="eventTitle" placeholder="Title">

<textarea id="eventDescription"
placeholder="Description"
rows="4"></textarea>

<button class="event-save" onclick="saveEvent()">
SAVE EVENT
</button>

<button class="clear" onclick="hideEventForm()">
CANCEL
</button>

</div>

<div id="historyList"></div>

</div>
</div>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL = "https://zqptyvkvvzsyvvouvcgf.supabase.co";

const SUPABASE_KEY = "sb_publishable_OcP1l_4XOO3xClIBoq8RDg_iNNjCaYZ";

const API = SUPABASE_URL + "/rest/v1";

let currentVehicleId = null;


// API REQUEST

async function apiRequest(url, options = {}) {

  const response = await fetch(API + url, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + (adminSession?.access_token || SUPABASE_KEY),
      "Content-Type": "application/json",
      "Prefer": "return=representation",
      ...(options.headers || {})
    }
  });

  const text = await response.text();

  if (!response.ok) {
    throw new Error(text || response.statusText);
  }

  return text ? JSON.parse(text) : null;
}


// STATUS

function showStatus(message) {
  document.getElementById("status").textContent = message;
}


// SAVE VEHICLE

// SEARCH VEHICLE
async function saveVehicle() {

  if (!adminSession || !adminSession.access_token) {
    showStatus("Admin login required");
    return;
  }

  const customer = document.getElementById("customer").value.trim();
  const location = document.getElementById("location").value.trim();
  const vehicle_name = document.getElementById("vehicle_name").value.trim();
  const model = document.getElementById("model").value.trim();
  const serial = document.getElementById("serial").value.trim();

  if (!serial) {
    showStatus("Serial Number is required");
    return;
  }

  try {

    showStatus("Saving...");

    const existing = await apiRequest(
      "/vehicles?serial=eq." + encodeURIComponent(serial) + "&select=*"
    );

    const data = {
      customer,
      location,
      vehicle_name,
      model,
      serial
    };

    if (existing && existing.length > 0) {

      await apiRequest(
        "/vehicles?id=eq." + existing[0].id,
        {
          method: "PATCH",
          body: JSON.stringify(data)
        }
      );

      currentVehicleId = existing[0].id;
      showStatus("Vehicle updated successfully");

    } else {

      const vehicle = await apiRequest(
        "/vehicles",
        {
          method: "POST",
          body: JSON.stringify(data)
        }
      );

      currentVehicleId = vehicle[0].id;
      showStatus("Vehicle saved successfully");
    }

    document.getElementById("historySection")
      .classList.remove("hidden");

    await loadHistory();

  } catch (error) {

    showStatus("ERROR: " + error.message);

  }
}

  
// SEARCH VEHICLE
async function searchVehicle() {
  const keyword = document.getElementById("serial").value.trim().toUpperCase();

  if (!keyword) {
    showStatus("Enter Search Keyword");
    return;
  }

  try {
    showStatus("Searching...");

    const result = await apiRequest("/vehicles?select=*");

    const matches = (result || []).filter(vehicle =>
      [
        vehicle.serial,
        vehicle.customer,
        vehicle.model,
        vehicle.vehicle_name,
        vehicle.location
      ].some(value => (value || "").toUpperCase().includes(keyword))
    );

    let box = document.getElementById("searchResults");

    if (!box) {
      box = document.createElement("div");
      box.id = "searchResults";
      document.getElementById("historySection").before(box);
    }

    box.innerHTML = "";

    if (matches.length === 0) {
      currentVehicleId = null;
      ["customer", "location", "vehicle_name", "model", "serial"].forEach(id => {
  document.getElementById(id).classList.remove("search-found");
});
      document.getElementById("historySection").classList.add("hidden");
      showStatus("Vehicle not found");
      return;
    }

    if (matches.length === 1) {
      await selectVehicle(matches[0]);
      showStatus("Vehicle found");
      return;
    }

    showStatus(matches.length + " vehicles found");

    matches.forEach(vehicle => {
      const button = document.createElement("button");

      button.style.display = "block";
      button.style.width = "100%";
      button.style.padding = "12px";
      button.style.margin = "8px 0";
      button.style.textAlign = "left";
      button.style.background = "#ffffff";
      button.style.color = "#222222";
      button.style.border = "1px solid #cccccc";
      button.style.borderRadius = "8px";
      button.style.cursor = "pointer";

      button.textContent =
        (vehicle.customer || "") + " | " +
        (vehicle.vehicle_name || "") + " | " +
        (vehicle.model || "") + " | " +
        (vehicle.serial || "");

      button.onclick = async () => {
        await selectVehicle(vehicle);
        box.innerHTML = "";
        showStatus("Vehicle found");
      };

      box.appendChild(button);
    });

  } catch (error) {
    showStatus("ERROR: " + error.message);
  }
}

async function selectVehicle(vehicle) {
  currentVehicleId = vehicle.id;

  document.getElementById("customer").value = vehicle.customer || "";
  document.getElementById("location").value = vehicle.location || "";
  document.getElementById("vehicle_name").value = vehicle.vehicle_name || "";
  document.getElementById("model").value = vehicle.model || "";
  document.getElementById("serial").value = vehicle.serial || "";
  ["customer", "location", "vehicle_name", "model", "serial"].forEach(id => {
  document.getElementById(id).classList.add("search-found");
});

  document.getElementById("historySection").classList.remove("hidden");

  await loadHistory();
}
    
function clearForm() {

  document.getElementById("customer").value = "";
  document.getElementById("location").value = "";
  document.getElementById("vehicle_name").value = "";
  document.getElementById("model").value = "";
  document.getElementById("serial").value = "";

  document.getElementById("historySection")
    .classList.add("hidden");

  document.getElementById("historyList").innerHTML = "";

  currentVehicleId = null;
  ["customer", "location", "vehicle_name", "model", "serial"].forEach(id => {
  document.getElementById(id).classList.remove("search-found");
});

  showStatus("");
}


// ADD EVENT

function showEventForm() {

  if (!currentVehicleId) {
    showStatus("Please SAVE or SEARCH a vehicle first");
    return;
  }

  document.getElementById("eventForm")
    .classList.remove("hidden");

  document.getElementById("eventDate").value =
    new Date().toISOString().slice(0, 10);
}


function hideEventForm() {

  document.getElementById("eventForm")
    .classList.add("hidden");
}


// SAVE EVENT

async function saveEvent() {

  if (!currentVehicleId) {
    showStatus("No vehicle selected");
    return;
  }

  const event_date = document.getElementById("eventDate").value;
  const title = document.getElementById("eventTitle").value.trim();
  const description = document.getElementById("eventDescription").value.trim();

  if (!event_date || !title) {
    showStatus("Date and Title are required");
    return;
  }

  try {

    showStatus("Saving event...");

    await apiRequest(
      "/vehicle_history",
      {
        method: "POST",
        body: JSON.stringify({
          vehicle_id: currentVehicleId,
          event_date,
          title,
          description
        })
      }
    );

    document.getElementById("eventDate").value = "";
    document.getElementById("eventTitle").value = "";
    document.getElementById("eventDescription").value = "";

    hideEventForm();

    await loadHistory();

    showStatus("Event saved successfully");

  } catch (error) {

    showStatus("ERROR: " + error.message);

  }
}


// LOAD HISTORY

async function loadHistory() {

  if (!currentVehicleId) return;

  const events = await apiRequest(
    "/vehicle_history?vehicle_id=eq." +
    currentVehicleId +
    "&select=*&order=event_date.desc,created_at.desc"
  );

  const list = document.getElementById("historyList");

  list.innerHTML = "";

  if (!events || events.length === 0) {

    list.innerHTML = "<p>No history available</p>";

    return;
  }

  events.forEach(event => {

    const div = document.createElement("div");
    div.className = "event";

    const date = document.createElement("div");
    date.className = "event-date";
    date.textContent = event.event_date;

    const title = document.createElement("strong");
    title.textContent = event.title;

    const description = document.createElement("p");
    description.textContent = event.description || "";

    div.appendChild(date);
    div.appendChild(title);
    div.appendChild(description);

    list.appendChild(div);

  });

}

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("NVN PWA ready"))
      .catch(err => console.error(err));
  });
}
</script>
<script>
document.querySelectorAll('input, textarea').forEach(el => {
  el.addEventListener('input', function() {
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.toUpperCase();
    this.setSelectionRange(start, end);
  });
});
</script>
<!-- ADMIN LOGIN -->
<div id="adminBox" style="margin-top:20px;padding:12px;background:#fff;border-radius:8px;">
  <button onclick="toggleAdminLogin()" style="background:#343a40;">
    ADMIN LOGIN
  </button>

  <div id="adminLoginForm" style="display:none;margin-top:10px;">
    <input id="adminEmail" type="email" placeholder="Admin Email">
    <input id="adminPassword" type="password" placeholder="Password">

    <button onclick="adminLogin()" style="background:#0d6efd;">
      LOGIN
    </button>

    <button onclick="toggleAdminLogin()" style="background:#6c757d;">
      CANCEL
    </button>
  </div>

  <div id="adminStatus" style="margin-top:10px;"></div>
</div>

<script>
let adminSession = null;

function toggleAdminLogin() {
  const form = document.getElementById("adminLoginForm");
  form.style.display = form.style.display === "none" ? "block" : "none";
}

async function adminLogin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  const status = document.getElementById("adminStatus");
  status.textContent = "Logging in...";

  try {
    const response = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || data.msg || "Login failed");
    }

    adminSession = data;

    status.textContent = "Admin login successful";

    document.getElementById("adminLoginForm").style.display = "none";
    document.getElementById("saveBtn").style.display = "block";

  } catch (error) {
    adminSession = null;
    status.textContent = "ERROR: " + error.message;
  }
}
</script>
</body>
</html>
