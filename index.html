let vn=0;
function openQuote(){if(!adminSession){status("Admin login required");return}db.classList.add("hidden");quoteApp.classList.remove("hidden");qd.value=new Date().toISOString().slice(0,10);vehicles.innerHTML="";vn=0;addVehicle();typeChanged()}
function closeQuote(){quoteApp.classList.add("hidden");db.classList.remove("hidden");document.getElementById("preview").classList.add("hidden");printActions.classList.add("hidden");quoteForm.classList.remove("hidden")}
function typeChanged(){let implemented=quoteType.value==="REPAIR & SPARE PARTS";quoteForm.classList.toggle("hidden",!implemented);typeNotice.textContent=implemented?"REPAIR & SPARE PARTS quotation form":"This quotation type is selected but not implemented yet. Repair & Spare Parts is currently available.";document.getElementById("preview").classList.add("hidden");printActions.classList.add("hidden")}
function addVehicle(){vn++;let v=document.createElement("div");v.className="qv";v.innerHTML=`<h4>Vehicle ${vn}</h4><div class="row"><input class="vname" placeholder="Vehicle Name"><input class="vmodel" placeholder="Model"></div><div class="row"><input class="vsn" placeholder="S/N"><input class="vtruck" placeholder="Truck No"></div><button class="search noprint" onclick="lookup(this)">SEARCH DATABASE BY S/N</button><div class="lookup noprint"></div><div class="items"></div><button class="dark noprint" onclick="addItem(this)">+ ADD ITEM</button><button class="delete noprint" onclick="this.closest('.qv').remove();totalsCalc()">REMOVE VEHICLE</button>`;vehicles.append(v);addItem(v.querySelector(".dark"))}
function addItem(b){let list=b.closest(".qv").querySelector(".items"),i=document.createElement("div");i.className="item";i.innerHTML=`<input class="desc" placeholder="Description"><div class="row"><input class="qty" type="number" min="0" value="1"><input class="unit" placeholder="Unit"></div><div class="row"><input class="price" type="number" min="0" placeholder="Unit Price"><input class="amount" placeholder="Amount" readonly></div><input class="remarks" placeholder="Remarks"><button class="delete noprint" onclick="this.closest('.item').remove();totalsCalc()">REMOVE ITEM</button>`;list.append(i);i.querySelectorAll(".qty,.price").forEach(x=>x.addEventListener("input",()=>calc(i)));calc(i)}
function calc(i){let a=(+i.querySelector(".qty").value||0)*(+i.querySelector(".price").value||0);i.querySelector(".amount").value=a.toLocaleString("en-US",{maximumFractionDigits:2});totalsCalc()}
function dataQ(){return [...document.querySelectorAll(".qv")].map(v=>({name:v.querySelector(".vname").value,model:v.querySelector(".vmodel").value,sn:v.querySelector(".vsn").value,truck:v.querySelector(".vtruck").value,items:[...v.querySelectorAll(".item")].map(i=>({desc:i.querySelector(".desc").value,qty:+i.querySelector(".qty").value||0,unit:i.querySelector(".unit").value,price:+i.querySelector(".price").value||0,amount:(+i.querySelector(".qty").value||0)*(+i.querySelector(".price").value||0),remarks:i.querySelector(".remarks").value}))}))}
function totalsCalc(){let sub=dataQ().reduce((s,v)=>s+v.items.reduce((a,i)=>a+i.amount,0),0),dis=Math.max(0,+discount.value||0),base=Math.max(0,sub-dis),rate=+vat.value||0,tax=base*rate/100,total=base+tax,fmt=n=>n.toLocaleString("en-US",{maximumFractionDigits:2});totals.innerHTML="Subtotal: "+fmt(sub)+"<br>Discount: "+fmt(dis)+"<br>VAT "+rate+"%: "+fmt(tax)+"<br><strong>Grand Total: "+fmt(total)+"</strong>";return{sub,dis,rate,tax,total}}
async function lookup(b){let sn=b.closest(".qv").querySelector(".vsn").value.trim(),box=b.nextElementSibling;if(!sn){box.textContent="Enter S/N";return}box.textContent="Searching...";try{let a=await api("/vehicles?serial=ilike."+encodeURIComponent("%"+sn+"%")+"&select=*");box.innerHTML="";if(!a.length){box.textContent="Not found; fill manually";return}a.forEach(v=>{let bt=document.createElement("button");bt.style.cssText="background:#eee;color:#222";bt.textContent=[v.customer,v.vehicle_name,v.model,v.serial].join(" | ");bt.onclick=()=>{let card=b.closest(".qv");card.querySelector(".vname").value=v.vehicle_name||"";card.querySelector(".vmodel").value=v.model||"";card.querySelector(".vsn").value=v.serial||"";box.textContent="Vehicle details loaded"};box.append(bt)})}catch(e){box.textContent="Search error: "+e.message}}
discount.addEventListener("input",totalsCalc);vat.addEventListener("change",totalsCalc);
function renderQuotePreview(){if(quoteType.value!=="REPAIR & SPARE PARTS"){alert("This type is not implemented yet.");return}let ds=dataQ(),t=totalsCalc(),esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),fmt=n=>n.toLocaleString("en-US",{maximumFractionDigits:2}),counter=1,body="";ds.forEach(v=>{body+=`<tr class="qpdf-vrow vinfo"><td style="text-align:center"></td><td>Model: ${esc(v.model)}, S/N: ${esc(v.sn)}${v.truck?", Truck No: "+esc(v.truck):""}</td><td></td><td></td><td></td><td></td><td></td></tr>`;v.items.forEach(i=>{body+=`<tr><td style="text-align:center">${counter++}</td><td>${esc(i.desc)}${i.remarks?"<br><span style=\"color:#b22222\">"+esc(i.remarks)+"</span>":""}</td><td style="text-align:center">${i.qty}</td><td style="text-align:center">${esc(i.unit)}</td><td style="text-align:right">${fmt(i.price)}</td><td style="text-align:right">${fmt(i.amount)}</td><td></td></tr>`})});
body+=`<tr class="qpdf-warranty"><td></td><td>Warranty ${esc(document.getElementById("warranty")?.value||"03")} months due to defected manufacturer.</td><td></td><td></td><td></td><td></td><td></td></tr>`;

function fitQuotationA4(){
 const shell=preview.querySelector(".qpdf-shell"); if(!shell)return;
 const tbody=preview.querySelector(".qpdf-items tbody"); if(!tbody)return;
 // Reset previous fit state and blank rows before measuring.
 shell.classList.remove("qpdf-fit1","qpdf-fit2","qpdf-fit3"); tbody.querySelectorAll(".qpdf-blank").forEach(r=>r.remove());
 const target=1045; // usable A4 height at 96dpi, with 10mm print margins
 const addBlank=()=>{let r=document.createElement("tr");r.className="qpdf-blank";r.innerHTML="<td></td><td></td><td></td><td></td><td></td><td></td><td></td>";tbody.insertBefore(r,tbody.querySelector(".qpdf-warranty"));};
 // Compress in stages only if the populated quotation is too tall.
 for(let level=0;level<4;level++){
   if(level) shell.classList.add("qpdf-fit"+level);
   if(shell.getBoundingClientRect().height<=target)break;
 }
 // For shorter quotations, add blank rows dynamically until the page is nearly full.
 let n=0; while(shell.getBoundingClientRect().height<target-18 && n<30){addBlank();n++;}
 // If even a filled page exceeds the target, use the strongest compact setting.
 if(shell.getBoundingClientRect().height>target && !shell.classList.contains("qpdf-fit3"))shell.classList.add("qpdf-fit3");
}

function editQuote(){document.getElementById("preview").classList.add("hidden");printActions.classList.add("hidden");quoteForm.classList.remove("hidden")}
