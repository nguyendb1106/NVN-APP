*{box-sizing:border-box}body{font-family:Arial;background:#f2f4f7;margin:0;padding:15px;color:#222}.container{max-width:650px;margin:auto}h2{text-align:center;color:#1f2937}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;font-size:16px;border-radius:6px;border:1px solid #ccc}button{border:0;color:white;font-weight:bold}.save{background:#198754}.search{background:#0d6efd}.clear{background:#6c757d}.dark{background:#1f2937}.delete{background:#dc3545}.purple{background:#6f42c1}.hidden{display:none!important}.card{background:white;border-radius:10px;padding:15px;margin-top:15px;box-shadow:0 2px 6px #0001}.event{border-left:3px solid #0d6efd;padding:10px;margin:12px 0;background:#f8f9fa}.found{background:#ffeb3b!important}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.qv,.item{border:1px solid #ccc;border-radius:8px;padding:10px;margin:10px 0;background:#fff}.preview{background:white;padding:14px}.preview table{width:100%;border-collapse:collapse;font-size:12px}.preview th,.preview td{border:1px solid #444;padding:5px;vertical-align:top}.preview h2{margin:10px 0}@media print{body *{visibility:hidden}#preview,#preview *{visibility:visible}#preview{position:absolute;left:0;top:0;width:100%;padding:10mm}.noprint{display:none!important}}

</style></head><body>
<div class="container" id="db"><h2>NVN FORKLIFT DATABASE</h2>
<input id="customer" placeholder="Customer Name"><input id="location" placeholder="Location"><input id="vehicle_name" placeholder="Vehicle Name"><input id="model" placeholder="Model"><input id="serial" placeholder="Serial Number">
<button id="saveBtn" class="save hidden" onclick="saveVehicle()">SAVE</button><button class="search" onclick="searchVehicle()">SEARCH</button><button class="clear" onclick="clearForm()">CLEAR</button><button id="delBtn" class="delete hidden" onclick="deleteVehicle()">DELETE VEHICLE</button><button id="importBtn" class="dark hidden" onclick="excelFile.click()">TRUCK DATA UPLOAD</button><input id="excelFile" type="file" accept=".xlsx,.xls" class="hidden"><div id="status"></div>
<div id="history" class="card hidden"><h3>History</h3><button class="dark" onclick="showEventForm()">+ ADD EVENT</button><div id="eventForm" class="hidden"><input type="date" id="eventDate"><input id="eventTitle" placeholder="Title"><textarea id="eventDescription" placeholder="Description"></textarea><button class="save" onclick="saveEvent()">SAVE EVENT</button><button class="clear" onclick="hideEventForm()">CANCEL</button></div><div id="historyList"></div></div>
<div class="card"><button class="dark" onclick="toggleAdmin()">ADMIN LOGIN</button><div id="loginForm" class="hidden"><input id="adminEmail" type="email" placeholder="Admin Email"><input id="adminPassword" type="password" placeholder="Password"><button class="search" onclick="adminLogin()">LOGIN</button><button class="clear" onclick="toggleAdmin()">CANCEL</button></div><div id="adminStatus"></div><button id="quoteBtn" class="purple hidden" onclick="openQuote()">QUOTATION</button></div></div>
<div class="container hidden" id="quoteApp"><button class="clear noprint" onclick="closeQuote()">← BACK TO DATABASE</button><h2>NVN QUOTATION</h2>
<div class="card noprint"><select id="quoteType" onchange="typeChanged()"><option>REPAIR & SPARE PARTS</option><option>NEW FORKLIFT RENTAL</option><option>USED FORKLIFT RENTAL</option><option>NEW FORKLIFT SALES</option></select><div id="typeNotice"></div></div>
<div id="quoteForm" class="card noprint"><h3>Quotation Information</h3><input id="qc" placeholder="Customer"><input id="qa" placeholder="Attn"><input id="qe" placeholder="Email"><div class="row"><input id="qr" placeholder="Ref No"><input id="qd" type="date"></div><input id="qfrom" value="Duong Bao Nguyen" placeholder="From"><div class="row"><input id="qphone" value="0869 289 179" placeholder="Mobile"><input id="qemail" value="nvn4@bpi.com.vn" placeholder="Email"></div><input id="qsub" placeholder="Subject"><h3>Vehicles / Items</h3><div id="vehicles"></div><button class="dark" onclick="addVehicle()">+ ADD VEHICLE</button><h3>Totals</h3><div class="row"><input id="discount" type="number" value="0" min="0" placeholder="Discount"><select id="vat"><option value="8">VAT 8%</option><option value="10">VAT 10%</option><option value="0">VAT 0%</option></select></div><div id="totals"></div><input id="payment" value="Chuyển khoản qua Ngân hàng Vietcombank/ACB trong vòng 30 ngày sau khi giao hàng." placeholder="Thanh toán"><input id="delivery" value="trong vòng 5-7 ngày làm việc." placeholder="Giao hàng"><input id="validity" type="number" value="30" placeholder="Validity (days)"><button class="purple" onclick="renderQuotePreview()">PREVIEW QUOTATION</button></div>
<div id="preview" class="preview hidden"></div><div id="printActions" class="noprint hidden"><button class="save" onclick="window.print()">PRINT / SAVE PDF</button><button class="clear" onclick="editQuote()">EDIT</button></div></div>
<script>
const URL="https://zqptyvkvvzsyvvouvcgf.supabase.co",KEY="sb_publishable_OcP1l_4XOO3xClIBoq8RDg_iNNjCaYZ",API=URL+"/rest/v1";let adminSession=null,currentVehicleId=null,searched=false;
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+(adminSession?.access_token||KEY),"Content-Type":"application/json",Prefer:"return=representation",...(opt.headers||{})}});let t=await r.text();if(!r.ok)throw Error(t||r.statusText);return t?JSON.parse(t):null}
function status(s){document.getElementById("status").textContent=s}function updateDel(){delBtn.classList.toggle("hidden",!(adminSession?.access_token&&currentVehicleId&&searched))}
async function saveVehicle(){if(!adminSession){status("Admin login required");return}let d={customer:customer.value.trim(),location:location.value.trim(),vehicle_name:vehicle_name.value.trim(),model:model.value.trim(),serial:serial.value.trim()};if(!d.serial){status("Serial Number is required");return}try{status("Saving...");let x=await api("/vehicles?serial=eq."+encodeURIComponent(d.serial)+"&select=*");if(x.length){await api("/vehicles?id=eq."+x[0].id,{method:"PATCH",body:JSON.stringify(d)});currentVehicleId=x[0].id;searched=false;status("Vehicle updated")}else{let z=await api("/vehicles",{method:"POST",body:JSON.stringify(d)});currentVehicleId=z[0].id;searched=false;status("Vehicle saved")}updateDel();document.getElementById("history").classList.remove("hidden");await loadHistory()}catch(e){status("ERROR: "+e.message)}}
async function searchVehicle(){searched=false;updateDel();let k=serial.value.trim().toUpperCase();if(!k){status("Enter Search Keyword");return}try{status("Searching...");let all=await api("/vehicles?select=*"),m=all.filter(v=>[v.serial,v.customer,v.model,v.vehicle_name,v.location].some(x=>(x||"").toUpperCase().includes(k)));let b=document.getElementById("results");if(!b){b=document.createElement("div");b.id="results";document.getElementById("history").before(b)}b.innerHTML="";if(!m.length){currentVehicleId=null;updateDel();document.getElementById("history").classList.add("hidden");status("Vehicle not found");return}if(m.length===1){await selectV(m[0]);status("Vehicle found");return}status(m.length+" vehicles found");m.forEach(v=>{let bt=document.createElement("button");bt.style.cssText="background:white;color:#222;border:1px solid #ccc;text-align:left";bt.textContent=[v.customer,v.vehicle_name,v.model,v.serial].join(" | ");bt.onclick=async()=>{await selectV(v);b.innerHTML="";status("Vehicle found")};b.append(bt)})}catch(e){status("ERROR: "+e.message)}}
async function selectV(v){currentVehicleId=v.id;searched=true;["customer","location","vehicle_name","model","serial"].forEach(i=>{document.getElementById(i).value=v[i]||"";document.getElementById(i).classList.add("found")});updateDel();document.getElementById("history").classList.remove("hidden");await loadHistory()}
function clearForm(){["customer","location","vehicle_name","model","serial"].forEach(i=>{let e=document.getElementById(i);e.value="";e.classList.remove("found")});document.getElementById("history").classList.add("hidden");historyList.innerHTML="";if(results)results.innerHTML="";currentVehicleId=null;searched=false;updateDel();status("")}
async function deleteVehicle(){if(!adminSession){status("Admin login required");return}if(!currentVehicleId||!searched){status("SEARCH vehicle first");return}if(!confirm("DELETE THIS VEHICLE AND ITS HISTORY?\\n"+customer.value+" | "+serial.value+"\\nThis cannot be undone."))return;try{let id=currentVehicleId;status("Deleting history...");await api("/vehicle_history?vehicle_id=eq."+encodeURIComponent(id),{method:"DELETE"});status("Deleting vehicle...");await api("/vehicles?id=eq."+encodeURIComponent(id),{method:"DELETE"});clearForm();status("Vehicle deleted")}catch(e){status("DELETE ERROR: "+e.message)}}
function showEventForm(){if(!adminSession){status("Admin login required");return}if(!currentVehicleId){status("SAVE or SEARCH a vehicle first");return}eventForm.classList.remove("hidden");eventDate.value=new Date().toISOString().slice(0,10)}function hideEventForm(){eventForm.classList.add("hidden")}
async function saveEvent(){if(!adminSession||!currentVehicleId){status("Admin login required / select vehicle");return}if(!eventDate.value||!eventTitle.value.trim()){status("Date and Title required");return}try{await api("/vehicle_history",{method:"POST",body:JSON.stringify({vehicle_id:currentVehicleId,event_date:eventDate.value,title:eventTitle.value.trim(),description:eventDescription.value.trim()})});eventTitle.value=eventDescription.value="";hideEventForm();await loadHistory();status("Event saved")}catch(e){status("ERROR: "+e.message)}}
async function loadHistory(){if(!currentVehicleId)return;let a=await api("/vehicle_history?vehicle_id=eq."+currentVehicleId+"&select=*&order=event_date.desc,created_at.desc");historyList.innerHTML="";if(!a.length){historyList.innerHTML="<p>No history available</p>";return}a.forEach(v=>{let d=document.createElement("div");d.className="event";d.innerHTML="";let date=document.createElement("div");date.textContent=v.event_date;let title=document.createElement("strong");title.textContent=v.title;let desc=document.createElement("p");desc.textContent=v.description||"";d.append(date,title,desc);historyList.append(d)})}
function toggleAdmin(){loginForm.classList.toggle("hidden")}async function adminLogin(){adminStatus.textContent="Logging in...";try{let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:adminEmail.value.trim(),password:adminPassword.value})});let d=await r.json();if(!r.ok)throw Error(d.message||"Login failed");adminSession=d;adminStatus.textContent="Admin login successful";loginForm.classList.add("hidden");saveBtn.classList.remove("hidden");importBtn.classList.remove("hidden");quoteBtn.classList.remove("hidden");updateDel()}catch(e){adminSession=null;adminStatus.textContent="ERROR: "+e.message;quoteBtn.classList.add("hidden");updateDel()}}
</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
excelFile.addEventListener("change",async e=>{try{if(!adminSession){status("Admin login required");return}let f=e.target.files[0];if(!f)return;status("Reading Excel...");let w=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:""});let v=rows.map(r=>({customer:String(r.CUSTOMER||"").trim(),location:String(r.LOCATION||"").trim(),vehicle_name:String(r["VEHICLE NAME"]||"").trim(),model:String(r.MODEL||"").trim(),serial:String(r.SERIAL||"").trim()})),valid=v.filter(x=>x.serial),missing=v.length-valid.length;if(!valid.length){status("No valid SERIAL");return}status("Checking existing vehicles...");let existing=await api("/vehicles?select=serial"),s=new Set(existing.map(x=>(x.serial||"").toLowerCase())),seen=new Set(),add=[],dups=0;valid.forEach(x=>{let z=x.serial.toLowerCase();if(s.has(z)||seen.has(z))dups++;else{seen.add(z);add.push(x)}});if(!add.length){status("No new vehicles");return}if(!confirm("New: "+add.length+"\\nDuplicates: "+dups+"\\nMissing serial: "+missing+"\\nImport?"))return;await api("/vehicles",{method:"POST",body:JSON.stringify(add)});status("Imported "+add.length+"; duplicates "+dups+"; missing "+missing)}catch(e){status("IMPORT ERROR: "+e.message);alert(e.message)}finally{e.target.value=""}});
</script>
<script>
// Quotation module
let vn=0;
function openQuote(){if(!adminSession){status("Admin login required");return}db.classList.add("hidden");quoteApp.classList.remove("hidden");qd.value=new Date().toISOString().slice(0,10);vehicles.innerHTML="";vn=0;addVehicle();typeChanged()}
function closeQuote(){quoteApp.classList.add("hidden");db.classList.remove("hidden");document.getElementById("preview").classList.add("hidden");printActions.classList.add("hidden");quoteForm.classList.remove("hidden")}
function typeChanged(){let implemented=quoteType.value==="REPAIR & SPARE PARTS";quoteForm.classList.toggle("hidden",!implemented);typeNotice.textContent=implemented?"REPAIR & SPARE PARTS quotation form":"This quotation type is selected but not implemented yet. Repair & Spare Parts is currently available.";document.getElementById("preview").classList.add("hidden");printActions.classList.add("hidden")}
function addVehicle(){vn++;let v=document.createElement("div");v.className="qv";v.innerHTML=`<h4>Vehicle ${vn}</h4><div class="row"><input class="vname" placeholder="Vehicle Name"><input class="vmodel" placeholder="Model"></div><div class="row"><input class="vsn" placeholder="S/N"><input class="vtruck" placeholder="Truck No"></div><button class="search noprint" onclick="lookup(this)">SEARCH DATABASE BY S/N</button><div class="lookup noprint"></div><div class="items"></div><button class="dark noprint" onclick="addItem(this)">+ ADD ITEM</button><button class="delete noprint" onclick="this.closest('.qv').remove();totalsCalc()">REMOVE VEHICLE</button>`;vehicles.append(v);addItem(v.querySelector(".dark"))}
function addItem(b){let list=b.closest(".qv").querySelector(".items"),i=document.createElement("div");i.className="item";i.innerHTML=`<input class="desc" placeholder="Description"><div class="row"><input class="qty" type="number" min="0" value="1"><input class="unit" placeholder="Unit"></div><div class="row"><input class="price" type="number" min="0" placeholder="Unit Price"><input class="amount" placeholder="Amount" readonly></div><input class="remarks" placeholder="Remarks"><button class="delete noprint" onclick="this.closest('.item').remove();totalsCalc()">REMOVE ITEM</button>`;list.append(i);i.querySelectorAll(".qty,.price").forEach(x=>x.addEventListener("input",()=>calc(i)));calc(i)}
function calc(i){let a=(+i.querySelector(".qty").value||0)*(+i.querySelector(".price").value||0);i.querySelector(".amount").value=a.toLocaleString("en-US",{maximumFractionDigits:2});totalsCalc()}
function dataQ(){return [...document.querySelectorAll(".qv")].map(v=>({name:v.querySelector(".vname").value,model:v.querySelector(".vmodel").value,sn:v.querySelector(".vsn").value,truck:v.querySelector(".vtruck").value,items:[...v.querySelectorAll(".item")].map(i=>({desc:i.querySelector(".desc").value,qty:+i.querySelector(".qty").value||0,unit:i.querySelector(".unit").value,price:+i.querySelector(".price").value||0,amount:(+i.querySelector(".qty").value||0)*(+i.querySelector(".price").value||0),remarks:i.querySelector(".remarks").value}))}))}
function totalsCalc(){let sub=dataQ().reduce((s,v)=>s+v.items.reduce((a,i)=>a+i.amount,0),0),dis=Math.max(0,+discount.value||0),base=Math.max(0,sub-dis),rate=+vat.value||0,tax=base*rate/100,total=base+tax,fmt=n=>n.toLocaleString("en-US",{maximumFractionDigits:2});totals.innerHTML="Subtotal: "+fmt(sub)+"<br>Discount: "+fmt(dis)+"<br>VAT "+rate+"%: "+fmt(tax)+"<br><strong>Grand Total: "+fmt(total)+"</strong>";return{sub,dis,rate,tax,total}}
async function lookup(b){let sn=b.closest(".qv").querySelector(".vsn").value.trim(),box=b.nextElementSibling;if(!sn){box.textContent="Enter S/N";return}box.textContent="Searching...";try{let a=await api("/vehicles?serial=ilike."+encodeURIComponent("%"+sn+"%")+"&select=*");box.innerHTML="";if(!a.length){box.textContent="Not found; fill manually";return}a.forEach(v=>{let bt=document.createElement("button");bt.style.cssText="background:#eee;color:#222";bt.textContent=[v.customer,v.vehicle_name,v.model,v.serial].join(" | ");bt.onclick=()=>{let card=b.closest(".qv");card.querySelector(".vname").value=v.vehicle_name||"";card.querySelector(".vmodel").value=v.model||"";card.querySelector(".vsn").value=v.serial||"";box.textContent="Vehicle details loaded"};box.append(bt)})}catch(e){box.textContent="Search error: "+e.message}}
